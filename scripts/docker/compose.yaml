version: "3.8"
services:
  libra-fortune:
    image: ghcr.io/kuretru/libra-fortune:main
    container_name: libra-fortune
    hostname: libra-fortune
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./application-production.yml:/app/config/application-production.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M
